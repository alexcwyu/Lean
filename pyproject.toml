[tool.uv]
package = false
# Python3.11 SHAP on Intel macOS requires an older NumPy/NumBa cohort.
# Keep this latest scientific lock explicit about that unsupported platform.
environments = ["sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[tool.uv.sources]
# Current upstream resource loader works on3.11; PyPI0.6.3 uses an invalid package anchor.
nolds = { git = "https://github.com/CSchoel/nolds", rev = "f121feebf6b2cbd67a8cb855bd0fe8c39add3ad9" }
# Current upstream DESlib uses public scikit-learn validate_data.
deslib = { git = "https://github.com/scikit-learn-contrib/DESlib", rev = "d0eaeec4f60dfc98a306620a258d68fd4d7331ef" }
# Upstream fixes the removed autograd.scipy.misc import; full existing HMM case passes.
ssm = { git = "https://github.com/lindermanlab/ssm", rev = "eb6c8aa33e5311d3564075807dec340759dd8081" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
# LEAN tests use Jean-Charles Richard's risk-budgeting library. The PyPI
# distribution named pyrb is unrelated web tooling; retain the real source pin.
pyrb = { git = "https://github.com/jcrichard/pyrb", rev = "250054efe02ce48cd1ae1ef72f8d808951af5a53" }

[tool.uv.extra-build-dependencies]
# iisignature imports NumPy in setup.py without declaring an isolated build requirement.
iisignature = [{ requirement = "numpy", match-runtime = true }]

# Legacy Creme needs these undeclared build requirements; its existing Bikes case passes.
creme = ["cython", { requirement = "numpy", match-runtime = true }]
ssm = ["cython", "numpy>=2.4.6"]

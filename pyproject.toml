[project]
name = "lean-python-development"
version = "0.1.0"
description = "Reproducible Python environment for LEAN algorithms and existing .NET embedding tests"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scipy>=1.17.1",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "pyarrow>=26.0.0",
    "seaborn>=0.13.2",
    "plotly>=7.1.0",
    "python-dateutil",
    "pytz",
    "ta-lib>=0.8.1",
    "tabulate",
    "jinja2",
]

[dependency-groups]
dev = ["pytest", "ruff"]
# Current third-party test bundle is validated on managed CPython3.11/macOS ARM.
# Other platform images retain their own package compatibility constraints.
third-party = [
    "ipykernel>=7.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "ssm>=0.0.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
